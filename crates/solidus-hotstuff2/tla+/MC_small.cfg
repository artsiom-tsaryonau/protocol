\* Small-bound EXHAUSTIVE config (MaxView=2) — fits limited disk; complements
\* the large simulation run on MC.cfg (MaxView=4). Run:
\*   tlc HotStuff2Commit.tla -config MC_small.cfg
CONSTANTS
    Replicas = {r1, r2, r3, r4}
    Byzantine = {r4}
    MaxView = 2
SPECIFICATION Spec
INVARIANTS
    NoConflictingCommits
    QcUniquePerView
