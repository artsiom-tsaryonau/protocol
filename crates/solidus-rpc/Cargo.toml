[package]
name = "solidus-rpc"
version.workspace = true
edition.workspace = true

[dependencies]
solidus-crypto = { workspace = true, features = ["bbs", "consensus"] }
solidus-txns = { workspace = true, features = ["bbs"] }
solidus-state.workspace = true
solidus-consensus.workspace = true
jsonrpsee = { workspace = true, features = ["server", "macros"] }
# tower 0.4 to match jsonrpsee 0.24's set_http_middleware(ServiceBuilder) signature.
tower = "0.4"
tower-http = { version = "0.6", features = ["cors"] }
http = "1"
serde.workspace = true
serde_json.workspace = true
rocksdb.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
hex.workspace = true
bs58.workspace = true

[dev-dependencies]
tempfile = "3"
ed25519-dalek = { workspace = true }
