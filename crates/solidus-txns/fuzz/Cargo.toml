[package]
name = "solidus-txns-fuzz"
version = "0.0.1"
edition = "2021"
publish = false

# cargo-fuzz requires this marker.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
solidus-txns = { path = ".." }
serde_json = "1"

# Isolate this package from the workspace so `cargo build` at the workspace
# root doesn't pull in libfuzzer-sys (only meaningful on x86_64-unknown-linux-gnu).
[workspace]

[[bin]]
name = "did_recover"
path = "fuzz_targets/did_recover.rs"
test = false
doc = false
