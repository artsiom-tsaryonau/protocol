[workspace]
resolver = "2"
members = [
    "crates/solidus-crypto",
    "crates/solidus-txns",
    "crates/solidus-state",
    "crates/solidus-consensus",
    "crates/solidus-p2p",
    "crates/solidus-rpc",
    "crates/solidus-node",
    # ---- v2 rebuild (parallel network, new chain-id) ----
    "crates/solidus-state-tree",
    "crates/solidus-exec",
    "crates/solidus-mempool-dag",
    "crates/solidus-hotstuff2",
    "crates/solidus-subnet",
    "crates/solidus-store2",
    "crates/solidus-evm",
    "crates/solidus-node2",
    "crates/solidus-rpc2",
    "crates/solidus-p2p2",
    "crates/solidus-noded",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/solidusnetwork/solidus"

[workspace.dependencies]
# Internal crates
solidus-crypto = { path = "crates/solidus-crypto" }
solidus-txns = { path = "crates/solidus-txns" }
solidus-state = { path = "crates/solidus-state" }
solidus-consensus = { path = "crates/solidus-consensus" }
solidus-p2p = { path = "crates/solidus-p2p" }
solidus-rpc = { path = "crates/solidus-rpc" }
solidus-state-tree = { path = "crates/solidus-state-tree" }
solidus-exec = { path = "crates/solidus-exec" }
solidus-mempool-dag = { path = "crates/solidus-mempool-dag" }
solidus-hotstuff2 = { path = "crates/solidus-hotstuff2" }
solidus-subnet = { path = "crates/solidus-subnet" }
solidus-store2 = { path = "crates/solidus-store2" }
solidus-evm = { path = "crates/solidus-evm" }
solidus-node2 = { path = "crates/solidus-node2" }
solidus-rpc2 = { path = "crates/solidus-rpc2" }
solidus-p2p2 = { path = "crates/solidus-p2p2" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1"
rand = "0.8"
blst = "0.3"
sha2 = "0.10"
zkryptium = { version = "0.6", default-features = false, features = ["bbsplus"] }

# Storage
rocksdb = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# RPC
jsonrpsee = { version = "0.24", features = ["server", "client", "http-client", "macros"] }

# Networking
libp2p = { version = "0.54", features = ["tcp", "noise", "yamux", "gossipsub", "request-response", "cbor", "tokio", "macros", "ed25519", "kad", "identify"] }
async-trait = "0.1"
bitvec = { version = "1", features = ["serde"] }

# Parallelism (v2 payment lane)
rayon = "1.10"

# Test / bench harness (v2 differential + criterion gates)
criterion = "0.5"
proptest = "1"
tempfile = "3"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
bs58 = "0.5"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
